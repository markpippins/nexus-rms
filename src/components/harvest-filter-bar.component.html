<!-- Search -->
<div class="relative w-44">
  <input
    type="text"
    [ngModel]="dataService.listViewSearchTerm()"
    (ngModelChange)="dataService.listViewSearchTerm.set($event)"
    [placeholder]="placeholder()"
    class="w-full pl-2.5 pr-6 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-amber-500/50"
  >
  @if (dataService.listViewSearchTerm()) {
    <button
      (click)="dataService.listViewSearchTerm.set('')"
      class="absolute right-1 top-1/2 -translate-y-1/2 p-0.5 rounded text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600"
      aria-label="Clear search"
      title="Clear search"
    >
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  }
</div>

<!-- Sort -->
<div class="flex items-center gap-1.5 flex-wrap">
  <span class="text-[10px] text-gray-400 dark:text-gray-500 uppercase font-medium">Sort</span>
  @for (opt of dataService.harvestSortOptions; track opt) {
    <button
      (click)="dataService.setHarvestSort(opt)"
      class="text-[10px] px-2 py-1 rounded-md font-medium transition-colors inline-flex items-center gap-1"
      [class]="dataService.harvestSortMode() === opt
        ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-400'
        : 'text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'"
    >
      {{ dataService.harvestSortLabels[opt] }}
      @if (dataService.harvestHasCandidatesCount() > 0) {
        <span class="text-[9px] font-normal tabular-nums leading-none px-1 py-0.5 rounded"
              [class]="dataService.harvestSortMode() === opt
                ? 'bg-amber-200/60 text-amber-600 dark:bg-amber-800/40 dark:text-amber-300'
                : 'bg-gray-200 text-gray-500 dark:bg-gray-600 dark:text-gray-400'">
          {{ dataService.harvestHasCandidatesCount() }}
        </span>
      }
    </button>
  }
</div>

<div class="hidden sm:block w-px h-5 bg-gray-200 dark:bg-gray-700"></div>

<!-- Tag filter -->
<div class="relative">
  <select
    (change)="dataService.applyHarvestTagFilter($any($event.target).value)"
    [value]="dataService.harvestTagFilter()"
    class="text-xs px-2 py-1 rounded-md border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-1 focus:ring-blue-400"
  >
    <option value="">All tags</option>
    @for (t of dataService.harvestHotTopicsData().length ? dataService.harvestHotTopicsData() : []; track t.tag) {
      <option [value]="t.tag">{{ t.tag }} ({{ t.cnt }})</option>
    }
  </select>
  @if (dataService.harvestTagFilter()) {
    <button (click)="dataService.applyHarvestTagFilter('')" class="absolute right-1 top-1/2 -translate-y-1/2 text-xs text-gray-400 hover:text-gray-600">&times;</button>
  }
</div>

<!-- Keyword filter -->
@if (dataService.harvestSortMode() === 'keyword_hits') {
  <div class="flex items-center gap-1">
    <input
      type="text"
      [ngModel]="dataService.harvestKeywordFilter()"
      (ngModelChange)="dataService.harvestKeywordFilter.set($event)"
      (keyup.enter)="dataService.applyHarvestKeyword()"
      placeholder="Keyword..."
      class="w-32 px-2.5 py-1.5 text-xs border border-amber-300 dark:border-amber-700 rounded-lg bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-amber-500/50"
    >
    <button
      (click)="dataService.applyHarvestKeyword()"
      class="p-1.5 rounded-lg text-amber-600 hover:text-amber-700 hover:bg-amber-50 dark:hover:bg-amber-900/20 transition-colors"
      title="Search keyword"
    >
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </button>
  </div>
}

<div class="hidden sm:block w-px h-5 bg-gray-200 dark:bg-gray-700"></div>

<!-- Distribution -->
<button
  (click)="dataService.loadHarvestDistribution()"
  class="p-1.5 rounded-lg transition-colors"
  [class]="dataService.harvestShowDistribution() ? 'text-purple-500 bg-purple-50 dark:bg-purple-900/20' : 'text-gray-400 hover:text-purple-500 hover:bg-purple-50 dark:hover:bg-purple-900/20'"
  title="View distribution"
>
  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
</button>

<div class="hidden sm:block w-px h-5 bg-gray-200 dark:bg-gray-700"></div>

<!-- Date range -->
<div class="flex items-center gap-1">
  <input
    type="date"
    [ngModel]="dataService.harvestDateFrom()"
    (ngModelChange)="dataService.harvestDateFrom.set($event); dataService.fetchHarvests()"
    class="w-28 h-7 px-1.5 text-[10px] border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-1 focus:ring-amber-500/50"
    title="From date"
  >
  <span class="text-[10px] text-gray-400 dark:text-gray-500">—</span>
  <input
    type="date"
    [ngModel]="dataService.harvestDateTo()"
    (ngModelChange)="dataService.harvestDateTo.set($event); dataService.fetchHarvests()"
    class="w-28 h-7 px-1.5 text-[10px] border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-1 focus:ring-amber-500/50"
    title="To date"
  >
  @if (dataService.harvestDateFrom() || dataService.harvestDateTo()) {
    <button
      (click)="dataService.harvestDateFrom.set(''); dataService.harvestDateTo.set(''); dataService.fetchHarvests()"
      class="p-1 rounded text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
      title="Clear date filter"
    >
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  }
</div>

<!-- Hide empty -->
<label class="flex items-center gap-1.5 cursor-pointer select-none" title="Hide harvests with 0 candidates">
  <input
    type="checkbox"
    [ngModel]="dataService.harvestHideEmpty()"
    (ngModelChange)="dataService.harvestHideEmpty.set($event)"
    class="h-3.5 w-3.5 rounded border-gray-300 dark:border-gray-600 text-amber-500 focus:ring-amber-500/50 focus:ring-offset-0"
  >
  <span class="text-[10px] text-gray-400 dark:text-gray-500 font-medium uppercase">Has Cand.</span>
</label>
